services:
  # Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    restart: always

  # PHP-FPM (PHP 8.5)
  php-fpm:
    build: ./php
    volumes:
      - ./src:/var/www/html
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres
      - redis
      - memcached
    restart: always

  # PostgreSQL 18
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # С именованным томом возвращаем дефолтный путь
      PGDATA: /var/lib/postgresql/data 
    volumes:
      # Используем изолированный Docker-том pg_data
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    restart: always

  # Redis
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: always

  # Memcached
  memcached:
    image: memcached:alpine
    restart: always

# Декларация именованных томов. Docker создаст их и будет управлять ими сам.
volumes:
  pg_data:      # Изолированный том для PostgreSQL 18
  redis_data:   # Изолированный том для Redis
